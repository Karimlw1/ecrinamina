<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — Écrin d'Amina</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Jost', sans-serif;
      background: #f4f6fb;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ---- SIDEBAR ---- */
    .sidebar {
      width: 220px;
      background: #0a1628;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      padding: 32px 0 24px;
      z-index: 100;
    }

    .sidebar-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: #fff;
      padding: 0 24px 32px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      line-height: 1.3;
    }
    .sidebar-logo span { color: #6B9FD4; font-size: 11px; display: block; font-family: 'Jost', sans-serif; font-weight: 400; margin-top: 3px; letter-spacing: 1px; text-transform: uppercase; }

    .sidebar-nav { display: flex; flex-direction: column; padding: 16px 0; flex: 1; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 24px;
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      border-left: 3px solid transparent;
      text-decoration: none;
    }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .nav-item.active { color: #fff; border-left-color: #6B9FD4; background: rgba(107,159,212,0.1); }
    .nav-item i { width: 16px; text-align: center; font-size: 14px; }

    .sidebar-footer {
      padding: 16px 24px 0;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-footer a {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.18s ease;
    }
    .sidebar-footer a:hover { color: rgba(255,255,255,0.7); }

    /* ---- MAIN ---- */
    .main {
      margin-left: 220px;
      padding: 32px;
      min-height: 100vh;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 20px 16px; }
    }

    /* ---- TOP BAR ---- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .topbar h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: #0a1628;
      font-weight: 600;
    }
    .topbar p { font-size: 13px; color: #8892a4; margin-top: 2px; }

    /* ---- CARDS ---- */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 20px;
      border: 1px solid #e8ecf4;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #0a1628;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .card-title i { color: #6B9FD4; font-size: 15px; }

    /* ---- FORM ---- */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #8892a4;
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e8ecf4;
      border-radius: 8px;
      background: #f9fafc;
      color: #1a1a2e;
      font-family: 'Jost', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.18s ease;
    }
    .form-group input:focus,
    .form-group select:focus { border-color: #6B9FD4; background: #fff; }
    .form-group select option { background: #fff; }

    .checkrow {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .checkrow label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #555;
      cursor: pointer;
    }
    .checkrow input[type=checkbox] {
      width: 15px; height: 15px;
      accent-color: #0a1628;
    }

    .divider { height: 1px; background: #f0f2f8; margin: 8px 0 20px; }

    /* ---- PREVIEW IMG ---- */
    .preview-img {
      width: 72px; height: 72px;
      border-radius: 8px;
      object-fit: cover;
      margin-top: 10px;
      display: none;
      border: 2px solid #6B9FD4;
    }

    /* ---- BUTTONS ---- */
    .btn {
      padding: 10px 22px;
      border-radius: 8px;
      border: none;
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .btn-dark { background: #0a1628; color: #fff; }
    .btn-dark:hover { background: #1a2d4a; transform: translateY(-1px); }
    .btn-blue { background: #6B9FD4; color: #fff; }
    .btn-blue:hover { background: #5a8ec3; transform: translateY(-1px); }
    .btn-red { background: #fff; color: #c0392b; border: 1.5px solid #f0d0ce; }
    .btn-red:hover { background: #fdf0ef; border-color: #c0392b; }
    .btn-outline { background: #fff; color: #0a1628; border: 1.5px solid #e8ecf4; }
    .btn-outline:hover { border-color: #0a1628; transform: translateY(-1px); }

    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

    /* ---- MSG ---- */
    .msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 13px;
      display: none;
    }
    .msg.ok { background: #edf7ed; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }
    .msg.err { background: #fdecea; color: #c0392b; border: 1px solid #f5c6c3; display: block; }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    Écrin d'Amina
    <span>Administration</span>
  </div>
  <nav class="sidebar-nav">
    <a class="nav-item active" onclick="show('sec-add')">
      <i class="fa fa-plus"></i> Ajouter produit
    </a>
    <a class="nav-item" onclick="show('sec-delete')">
      <i class="fa fa-trash"></i> Supprimer
    </a>
    <a class="nav-item" onclick="show('sec-modify')">
      <i class="fa fa-pen"></i> Modifier
    </a>
    <a class="nav-item" onclick="show('sec-dl')">
      <i class="fa fa-download"></i> Téléchargements
    </a>
  </nav>
  <div class="sidebar-footer">
    <a href="index.html"><i class="fa fa-arrow-left"></i> Voir le site</a>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div>
      <h1>Tableau de bord</h1>
      <p>Gestion des produits — Écrin d'Amina</p>
    </div>
  </div>

  <!-- ADD PRODUCT -->
  <div class="card" id="sec-add">
    <div class="card-title"><i class="fa fa-plus-circle"></i> Ajouter un produit</div>

    <div class="form-row">
      <div class="form-group">
        <label>Nom du produit *</label>
        <input type="text" id="prodName" placeholder="Ex: Robe fleurie..." />
      </div>
      <div class="form-group">
        <label>Prix (USD) *</label>
        <input type="number" id="prodPrice" placeholder="45" min="0" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Catégorie</label>
        <select id="prodCategory">
          <option value="Femme">Femme</option>
          <option value="Homme">Homme</option>
          <option value="Enfant">Enfant</option>
        </select>
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="prodType">
          <option value="robe">Robe</option>
          <option value="haut">Haut</option>
          <option value="bas">Bas</option>
          <option value="chaussure">Chaussure</option>
          <option value="Sac">Sac</option>
          <option value="complet">Complet</option>
          <option value="accessoire">Accessoire</option>
          <option value="Mailles">Mailles</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tailles (virgule)</label>
        <input type="text" id="prodSizes" placeholder="XS, S, M, L, XL" />
      </div>
      <div class="form-group">
        <label>Couleurs (virgule)</label>
        <input type="text" id="prodColors" placeholder="Rouge, Bleu, Noir" />
      </div>
    </div>
    <div class="form-group">
      <label>Image du produit *</label>
      <input type="file" id="prodImage" accept="image/*" onchange="previewImg(this)" />
      <img id="imgPreview" class="preview-img" />
    </div>
    <div class="form-group">
      <label>Badge "Nouveau" jusqu'au</label>
      <input type="datetime-local" id="prodNewUntil" />
    </div>
    <div class="checkrow">
      <label><input type="checkbox" id="prodLow" /> Stock limité</label>
      <label><input type="checkbox" id="prodEpuised" /> Épuisé</label>
      <label><input type="checkbox" id="prodSoon" /> Bientôt dispo</label>
    </div>
    <button class="btn btn-dark" onclick="addProduct()">
      <i class="fa fa-plus"></i> Ajouter le produit
    </button>
    <div class="msg" id="addMsg"></div>
  </div>

  <!-- DELETE -->
  <div class="card" id="sec-delete" style="display:none">
    <div class="card-title"><i class="fa fa-trash"></i> Supprimer un produit</div>
    <div class="form-group" style="max-width:360px">
      <label>ID du produit</label>
      <input type="text" id="deleteId" placeholder="Ex: Produit0" />
    </div>
    <button class="btn btn-red" onclick="deleteProduct()">
      <i class="fa fa-trash"></i> Supprimer définitivement
    </button>
    <div class="msg" id="deleteMsg"></div>
  </div>

  <!-- MODIFY -->
  <div class="card" id="sec-modify" style="display:none">
    <div class="card-title"><i class="fa fa-pen"></i> Modifier un produit</div>
    <div class="form-group" style="max-width:360px">
      <label>ID du produit</label>
      <input type="text" id="modifyId" placeholder="Ex: Produit0" />
    </div>
    <div class="divider"></div>

    <div class="form-row">
      <div>
        <div class="form-group">
          <label>Nouveau nom</label>
          <input type="text" id="modifyName" placeholder="Nouveau nom..." />
        </div>
        <button class="btn btn-outline" onclick="modifyName()">Changer le nom</button>
      </div>
      <div>
        <div class="form-group">
          <label>Nouveau prix</label>
          <input type="number" id="modifyPrice" placeholder="Nouveau prix..." />
        </div>
        <button class="btn btn-outline" onclick="modifyPrice()">Changer le prix</button>
      </div>
    </div>

    <div class="divider"></div>
    <div class="checkrow">
      <label><input type="checkbox" id="mLow" /> Stock limité</label>
      <label><input type="checkbox" id="mEpuised" /> Épuisé</label>
      <label><input type="checkbox" id="mSoon" /> Bientôt dispo</label>
      <div class="form-group" style="margin:0;flex:1;min-width:180px">
        <label>Nouveau jusqu'au</label>
        <input type="datetime-local" id="mNewUntil" />
      </div>
    </div>
    <button class="btn btn-blue" onclick="modifyBadges()">Mettre à jour les badges</button>
    <div class="msg" id="modifyMsg"></div>
  </div>

  <!-- DOWNLOADS -->
  <div class="card" id="sec-dl" style="display:none">
    <div class="card-title"><i class="fa fa-download"></i> Téléchargements</div>
    <div class="btn-group">
      <button class="btn btn-outline" onclick="download('products')">
        <i class="fa fa-box"></i> products.json
      </button>
      <button class="btn btn-outline" onclick="download('orders')">
        <i class="fa fa-receipt"></i> orders.json
      </button>
    </div>
    <div class="msg" id="dlMsg"></div>
  </div>

</div>

<script>
// No admin key — all requests sent without auth header
const ADMIN_KEY = '';

// ---- NAV ----
const sections = ['sec-add','sec-delete','sec-modify','sec-dl'];
const navItems = document.querySelectorAll('.nav-item');

function show(id) {
  sections.forEach(s => document.getElementById(s).style.display = s === id ? 'block' : 'none');
  navItems.forEach((n, i) => n.classList.toggle('active', sections[i] === id));
}

// ---- HELPERS ----
function msg(id, text, ok = true) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}

function previewImg(input) {
  const prev = document.getElementById('imgPreview');
  if (input.files?.[0]) {
    const r = new FileReader();
    r.onload = e => { prev.src = e.target.result; prev.style.display = 'block'; };
    r.readAsDataURL(input.files[0]);
  }
}

// ---- ADD ----
async function addProduct() {
  const name  = document.getElementById('prodName').value.trim();
  const price = Number(document.getElementById('prodPrice').value);
  const file  = document.getElementById('prodImage').files[0];

  if (!name || !price || !file) { msg('addMsg', 'Remplissez tous les champs obligatoires', false); return; }

  try {
    const fd = new FormData();
    fd.append('image', file);
    const upRes  = await fetch('/admin/upload-image', { method: 'POST', headers: {'x-admin-key': ADMIN_KEY}, body: fd });
    const upData = await upRes.json();
    if (!upData.imageUrl) throw new Error('Upload échoué');

    const product = {
      id: 'Produit_' + Date.now(),
      name, price,
      category:    document.getElementById('prodCategory').value,
      type:        document.getElementById('prodType').value,
      image:       upData.imageUrl,
      images:      [upData.imageUrl],
      options: {
        size:  document.getElementById('prodSizes').value.split(',').map(s => s.trim()).filter(Boolean),
        color: document.getElementById('prodColors').value.split(',').map(s => s.trim()).filter(Boolean),
      },
      newUntil:     document.getElementById('prodNewUntil').value ? new Date(document.getElementById('prodNewUntil').value).toISOString() : null,
      isRunningLow: document.getElementById('prodLow').checked,
      epuised:      document.getElementById('prodEpuised').checked,
      comingSoon:   document.getElementById('prodSoon').checked,
      available:    true,
    };

    const res  = await fetch('/admin/add-product', { method: 'POST', headers: {'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY}, body: JSON.stringify(product) });
    const data = await res.json();
    if (data.success) msg('addMsg', 'Produit ajouté avec succès');
    else msg('addMsg', 'Erreur : ' + (data.error || 'inconnue'), false);
  } catch(e) { msg('addMsg', 'Erreur : ' + e.message, false); }
}

// ---- DELETE ----
async function deleteProduct() {
  const id = document.getElementById('deleteId').value.trim();
  if (!id) { msg('deleteMsg', 'Entrez un ID', false); return; }
  if (!confirm(`Supprimer le produit "${id}" ?`)) return;
  const res  = await fetch(`/admin/delete-product/${id}`, { method: 'DELETE', headers: {'x-admin-key': ADMIN_KEY} });
  const data = await res.json();
  data.success ? msg('deleteMsg', 'Produit supprimé') : msg('deleteMsg', 'Erreur : ' + (data.error || 'introuvable'), false);
}

// ---- MODIFY NAME ----
async function modifyName() {
  const id   = document.getElementById('modifyId').value.trim();
  const name = document.getElementById('modifyName').value.trim();
  if (!id || !name) { msg('modifyMsg', 'ID et nom requis', false); return; }
  const res  = await fetch(`/admin/modify-product/${id}/name`, { method: 'PUT', headers: {'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY}, body: JSON.stringify({name}) });
  const data = await res.json();
  msg('modifyMsg', data.success ? 'Nom modifié' : 'Erreur : ' + (data.error || ''), data.success);
}

// ---- MODIFY PRICE ----
async function modifyPrice() {
  const id    = document.getElementById('modifyId').value.trim();
  const price = Number(document.getElementById('modifyPrice').value);
  if (!id || !price) { msg('modifyMsg', 'ID et prix requis', false); return; }
  const res  = await fetch(`/admin/modify-product/${id}/price`, { method: 'PUT', headers: {'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY}, body: JSON.stringify({price}) });
  const data = await res.json();
  msg('modifyMsg', data.success ? 'Prix modifié' : 'Erreur : ' + (data.error || ''), data.success);
}

// ---- MODIFY BADGES ----
async function modifyBadges() {
  const id = document.getElementById('modifyId').value.trim();
  if (!id) { msg('modifyMsg', 'Entrez un ID', false); return; }
  const body = {
    newUntil:     document.getElementById('mNewUntil').value ? new Date(document.getElementById('mNewUntil').value).toISOString() : null,
    isRunningLow: document.getElementById('mLow').checked,
    epuised:      document.getElementById('mEpuised').checked,
    comingSoon:   document.getElementById('mSoon').checked,
  };
  const res  = await fetch(`/admin/modify-product/${id}/badges`, { method: 'PUT', headers: {'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY}, body: JSON.stringify(body) });
  const data = await res.json();
  msg('modifyMsg', data.success ? 'Badges mis à jour' : 'Erreur : ' + (data.error || ''), data.success);
}

// ---- DOWNLOAD ----
async function download(type) {
  try {
    const res = await fetch(`/admin/download-${type}`, { headers: {'x-admin-key': ADMIN_KEY} });
    if (!res.ok) throw new Error('Accès refusé');
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `${type}.json`; a.click();
    URL.revokeObjectURL(url);
    msg('dlMsg', `${type}.json téléchargé`);
  } catch(e) { msg('dlMsg', 'Erreur : ' + e.message, false); }
}
</script>
</body>
</html>
