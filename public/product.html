<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail Produit Écrin d'Amina</title>
  <link rel="shortcut icon" href="https://res.cloudinary.com/dpsewpbqa/image/upload/v1772286865/logoEcrin_taiajz.png" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .product-page { max-width: 1100px; margin: 0 auto; padding: 24px 20px 140px; }

    @media (min-width: 720px) {
      .product-page { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 48px 48px 120px; }
    }

    /* GALLERY */
    .gallery { position: relative; }
    .gallery-main {
      border-radius: var(--radius);
      overflow: hidden;
      aspect-ratio: 3/4;
      background: var(--cream-dark);
      position: relative;
    }
    .gallery-main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .gallery-main:hover img { transform: scale(1.04); }
    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.85);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      color: var(--charcoal);
      transition: var(--transition);
      backdrop-filter: blur(4px);
      box-shadow: var(--shadow-sm);
      z-index: 2;
    }
    .gallery-nav:hover { background: var(--gold); color: white; transform: translateY(-50%) scale(1.08); }
    .gallery-nav.prev { left: 12px; }
    .gallery-nav.next { right: 12px; }
    .thumbs {
      display: flex; gap: 10px; margin-top: 14px;
      overflow-x: auto; padding-bottom: 4px;
      scrollbar-width: none;
    }
    .thumbs::-webkit-scrollbar { display: none; }
    .thumb {
      width: 68px; height: 68px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      border: 2px solid transparent;
      transition: var(--transition);
      opacity: 0.7;
    }
    .thumb:hover, .thumb.active { border-color: var(--gold); opacity: 1; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }

    /* PRODUCT INFO */
    .product-info { display: flex; flex-direction: column; gap: 20px; }
    .pi-category {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-dark);
    }
    .pi-name {
      font-family: var(--font-display);
      font-size: clamp(1.3rem, 3vw, 1.9rem);
      font-weight: 600;
      color: var(--charcoal);
      line-height: 1.3;
    }
    .pi-price {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold-dark);
    }
    .pi-badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .pi-divider { height: 1px; background: var(--cream-dark); }

    /* OPTIONS */
    .option-group { display: flex; flex-direction: column; gap: 10px; }
    .option-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .option-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .option-chip {
      padding: 6px 16px;
      border-radius: 50px;
      border: 1.5px solid var(--cream-dark);
      background: var(--white);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      color: var(--charcoal);
    }
    .option-chip:hover, .option-chip.selected {
      border-color: var(--gold);
      background: linear-gradient(135deg, rgba(201,168,76,0.1), rgba(201,168,76,0.15));
      color: var(--gold-dark);
    }

    /* QTY */
    .qty-wrap { display: flex; align-items: center; gap: 0; border: 1.5px solid var(--cream-dark); border-radius: 50px; overflow: hidden; width: fit-content; }
    .qty-btn {
      width: 38px; height: 38px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--charcoal);
      transition: var(--transition);
      display: flex; align-items: center; justify-content: center;
    }
    .qty-btn:hover { background: var(--cream-dark); color: var(--gold); }
    #qty {
      width: 44px;
      text-align: center;
      border: none;
      background: none;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--charcoal);
      outline: none;
    }

    /* DELIVERY */
    .delivery-input-wrap { position: relative; }
    .delivery-input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
    #localisation {
      width: 100%;
      padding: 13px 16px 13px 40px;
      border: 1.5px solid var(--cream-dark);
      border-radius: 12px;
      font-family: var(--font-body);
      font-size: 14px;
      background: var(--white);
      color: var(--charcoal);
      transition: var(--transition);
      outline: none;
    }
    #localisation:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.15); }
    #localisation::placeholder { color: var(--muted); }

    /* CTA BUTTONS */
    .cta-group { display: flex; gap: 12px; flex-direction: column; }
    @media (min-width: 480px) { .cta-group { flex-direction: row; } }
    .btn-primary {
      flex: 1;
      padding: 16px 24px;
      border-radius: 50px;
      border: none;
      background: var(--charcoal);
      color: white;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: var(--transition);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover { background: var(--gold); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,76,0.35); }
    .btn-primary:disabled { background: var(--muted); cursor: not-allowed; transform: none; }
    .btn-wish {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 1.5px solid var(--cream-dark);
      background: var(--white);
      color: var(--charcoal);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .btn-wish:hover, .btn-wish.active { border-color: var(--danger); color: var(--danger); transform: scale(1.08); }

    /* PRODUCT ID */
    .pi-id {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    /* TOAST */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--charcoal); color: white; padding: 12px 24px; border-radius: 50px; font-size: 13px; font-weight: 500; z-index: 9999; opacity: 0; transition: all 0.3s ease; white-space: nowrap; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <button class="nav-icon-btn" onclick="history.back()">
    <i class="fa fa-arrow-left"></i>
  </button>
  <span style="font-family: var(--font-display); font-size: 1rem; font-weight: 600; color: var(--charcoal);">Détail Produit</span>
  <a href="cart.html" class="nav-icon-btn">
    <i class="fa fa-shopping-bag"></i>
    <span class="badge" id="cartCount" style="display:none">0</span>
  </a>
</header>

<!-- PRODUCT PAGE -->
<main class="product-page">
  <!-- GALLERY -->
  <div class="gallery">
    <div class="gallery-main">
      <img id="mainImage" alt="Produit" />
      <button class="gallery-nav prev" id="prevBtn"><i class="fa fa-chevron-left"></i></button>
      <button class="gallery-nav next" id="nextBtn"><i class="fa fa-chevron-right"></i></button>
    </div>
    <div class="thumbs" id="thumbs"></div>
  </div>

  <!-- INFO -->
  <div class="product-info">
    <div class="pi-category" id="category"></div>
    <h1 class="pi-name" id="name"></h1>
    <div class="pi-price" id="price"></div>
    <div class="pi-badges" id="badges"></div>
    <div class="pi-divider"></div>

    <div id="optionsContainer"></div>

    <!-- QTY -->
    <div>
      <div class="option-label" style="margin-bottom:10px">Quantité</div>
      <div class="qty-wrap">
        <button class="qty-btn" id="qtyMinus"><i class="fa fa-minus"></i></button>
        <input type="number" id="qty" value="1" min="1" max="99" readonly />
        <button class="qty-btn" id="qtyPlus"><i class="fa fa-plus"></i></button>
      </div>
    </div>

    <!-- DELIVERY -->
    <div>
      <div class="option-label" style="margin-bottom:10px">Lieu de livraison <span style="color:var(--danger)">*</span></div>
      <div class="delivery-input-wrap">
        <i class="fa fa-map-marker-alt"></i>
        <input type="text" id="localisation" placeholder="Ex: Gombe, Kinshasa" required />
      </div>
    </div>

    <div class="pi-id" id="productId"></div>

    <div class="pi-divider"></div>

    <!-- CTA -->
    <div class="cta-group">
      <button class="btn-primary" id="addToCart">
        <i class="fa fa-shopping-bag"></i>
        <span>Ajouter au panier</span>
      </button>
      <button class="btn-wish" id="wishBtn" title="Favoris">
        <i class="fa-regular fa-heart"></i>
      </button>
    </div>

    <div style="font-size:12px; color: var(--muted); text-align:center; padding-top:4px;">
      <i class="fa fa-shield-alt" style="color:var(--gold)"></i> Paiement sécurisé via WhatsApp &nbsp;·&nbsp;
      <i class="fa fa-truck" style="color:var(--gold)"></i> Livraison à Kinshasa
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="cart-core.js"></script>
<script src="cart.js"></script>
<script>
// THEME
const savedTheme = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);

// TOAST
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2500);
}

// PRODUCT LOGIC
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
let product = null;
let currentImgIdx = 0;
let wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
let selectedSize = null, selectedColor = null;

fetch('/api/products')
  .then(r => r.json())
  .then(data => {
    product = data[id];
    if (!product) { document.querySelector('.product-page').innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:80px;color:var(--muted)">Produit introuvable</p>'; return; }
    if (!product.id) product.id = id;
    render();
  });

function render() {
  document.title = product.name + ' — Écrin d\'Amina';
  document.getElementById('category').textContent = product.category || '';
  document.getElementById('productId').textContent = 'Réf : ' + (product.id || id);
  document.getElementById('name').textContent = product.name || '';
  document.getElementById('price').textContent = `$${product.price}`;

  // Badges
  const badges = document.getElementById('badges');
  if (product.newUntil && new Date() <= new Date(product.newUntil)) badges.innerHTML += '<span class="badge-label new">Nouveau</span>';
  if (product.isRunningLow) badges.innerHTML += '<span class="badge-label low">Stock limité</span>';
  if (product.epuised) badges.innerHTML += '<span class="badge-label out">Épuisé</span>';
  if (product.comingSoon) badges.innerHTML += '<span class="badge-label soon">Bientôt</span>';

  // Gallery
  const images = product.images?.length ? product.images : [product.image].filter(Boolean);
  const mainImg = document.getElementById('mainImage');
  const thumbs = document.getElementById('thumbs');
  mainImg.src = images[0] || '';

  thumbs.innerHTML = images.map((img, i) => `
    <div class="thumb ${i===0?'active':''}" data-idx="${i}">
      <img src="${img}" alt="Vue ${i+1}" loading="lazy" />
    </div>
  `).join('');

  document.querySelectorAll('.thumb').forEach(t => {
    t.addEventListener('click', () => {
      currentImgIdx = +t.dataset.idx;
      updateGallery(images);
    });
  });

  document.getElementById('prevBtn').onclick = () => {
    currentImgIdx = (currentImgIdx - 1 + images.length) % images.length;
    updateGallery(images);
  };
  document.getElementById('nextBtn').onclick = () => {
    currentImgIdx = (currentImgIdx + 1) % images.length;
    updateGallery(images);
  };

  // Swipe
  let sx = 0;
  mainImg.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
  mainImg.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 40) {
      currentImgIdx = dx < 0 ? (currentImgIdx+1)%images.length : (currentImgIdx-1+images.length)%images.length;
      updateGallery(images);
    }
  }, {passive:true});

  function updateGallery(imgs) {
    mainImg.style.opacity = '0';
    setTimeout(() => { mainImg.src = imgs[currentImgIdx]; mainImg.style.opacity = '1'; }, 150);
    mainImg.style.transition = 'opacity 0.15s ease';
    document.querySelectorAll('.thumb').forEach((t,i) => t.classList.toggle('active', i===currentImgIdx));
  }

  // Options
  const optsEl = document.getElementById('optionsContainer');
  optsEl.innerHTML = '';

  if (product.options?.size?.length) {
    selectedSize = product.options.size[0];
    optsEl.innerHTML += `
      <div class="option-group">
        <div class="option-label">Taille</div>
        <div class="option-chips" id="sizeChips">
          ${product.options.size.map((s,i) => `<button class="option-chip ${i===0?'selected':''}" data-val="${s}">${s}</button>`).join('')}
        </div>
      </div>
    `;
  }

  if (product.options?.color?.length) {
    selectedColor = product.options.color[0];
    optsEl.innerHTML += `
      <div class="option-group">
        <div class="option-label">Couleur</div>
        <div class="option-chips" id="colorChips">
          ${product.options.color.map((c,i) => `<button class="option-chip ${i===0?'selected':''}" data-val="${c}">${c}</button>`).join('')}
        </div>
      </div>
    `;
  }

  optsEl.querySelectorAll('#sizeChips .option-chip').forEach(btn => {
    btn.onclick = () => {
      optsEl.querySelectorAll('#sizeChips .option-chip').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedSize = btn.dataset.val;
    };
  });

  optsEl.querySelectorAll('#colorChips .option-chip').forEach(btn => {
    btn.onclick = () => {
      optsEl.querySelectorAll('#colorChips .option-chip').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedColor = btn.dataset.val;
    };
  });

  // QTY
  let qty = 1;
  document.getElementById('qtyMinus').onclick = () => { if (qty > 1) { qty--; document.getElementById('qty').value = qty; } };
  document.getElementById('qtyPlus').onclick = () => { qty++; document.getElementById('qty').value = qty; };

  // WISHLIST
  const wishBtn = document.getElementById('wishBtn');
  const inWish = wishlist.includes(product.id);
  if (inWish) { wishBtn.classList.add('active'); wishBtn.querySelector('i').className = 'fa-solid fa-heart'; }

  wishBtn.onclick = () => {
    const idx = wishlist.indexOf(product.id);
    if (idx === -1) {
      wishlist.push(product.id);
      wishBtn.classList.add('active');
      wishBtn.querySelector('i').className = 'fa-solid fa-heart';
      showToast('Ajouté aux favoris');
    } else {
      wishlist.splice(idx, 1);
      wishBtn.classList.remove('active');
      wishBtn.querySelector('i').className = 'fa-regular fa-heart';
      showToast('Retiré des favoris');
    }
    localStorage.setItem('wishlist', JSON.stringify(wishlist));
  };

  // ADD TO CART
  if (product.epuised) {
    document.getElementById('addToCart').disabled = true;
    document.getElementById('addToCart').querySelector('span').textContent = 'Indisponible';
  }

  document.getElementById('addToCart').onclick = () => {
    const loc = document.getElementById('localisation').value.trim();
    if (!loc) {
      document.getElementById('localisation').focus();
      document.getElementById('localisation').style.borderColor = 'var(--danger)';
      showToast('Entrez votre lieu de livraison');
      return;
    }
    document.getElementById('localisation').style.borderColor = '';

    const btn = document.getElementById('addToCart');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div>';

    setTimeout(() => {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const existing = cart.find(i => i.id===product.id && i.size===selectedSize && i.color===selectedColor);
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          category: product.category,
          price: product.price,
          image: images[0] || product.image,
          size: selectedSize,
          color: selectedColor,
          localisation: loc,
          qty
        });
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-check"></i><span>Ajouté !</span>';
      showToast('Produit ajouté au panier');
      setTimeout(() => { btn.innerHTML = '<i class="fa fa-shopping-bag"></i><span>Ajouter au panier</span>'; }, 2000);
    }, 700);
  };
}
</script>
</body>
</html>
